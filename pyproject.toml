[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thetamill"
version = "0.1.0"
description = "Low-frequency option-selling toolkit for Interactive Brokers (covered call / cash-secured put)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Deng Wei Quan" }]
keywords = ["ibkr", "interactive-brokers", "options", "covered-call", "cash-secured-put", "theta"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["ib_async>=2.0"]

[project.optional-dependencies]
dev = ["ruff==0.17.4", "coverage[toml]==7.16.2"]

[project.urls]
Homepage = "https://github.com/dengweiquan/ThetaMill"

[project.scripts]
thetamill = "thetamill.cli:main"

[tool.setuptools]
packages = ["thetamill"]

[tool.coverage.run]
# Only the shipped package counts.  Tests are the instrument, not the subject.
source = ["thetamill"]
branch = true

[tool.coverage.report]
# A FLOOR, not a target: raising it as tests are added is fine, lowering it is a
# deliberate decision that must be argued in the commit message.  Pinned at the
# measured value so a change that removes coverage fails CI instead of quietly
# eroding the safety net around the risk/money code.
fail_under = 83
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
