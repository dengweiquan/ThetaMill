name: Offline safety gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    # NOTE: job-level env may only use github/inputs/matrix/needs/secrets/strategy/vars.
    # `runner` is step-scoped only, so CI scratch paths are derived from github.workspace.
    env:
      THETAMILL_DATA: ${{ github.workspace }}/.ci/data
      THETAMILL_CONFIG: ${{ github.workspace }}/.ci/no-broker-config.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: |
          mkdir -p .ci
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install --force-reinstall -c constraints.txt dist/*.whl
      - name: Source offline verification pipeline
        run: |
          python -m pip install "coverage[toml]==7.16.2" "ruff==0.17.4"
          python scripts/verify_offline.py
      - name: Whitespace and conflict markers
        run: |
          python scripts/check_diff.py
          if grep -rnE '^(<<<<<<< |=======|>>>>>>> )' thetamill tests; then
            exit 1
          fi
      - name: Installed-wheel tests and CLI help without configuration
        # Run outside the checkout so `import thetamill` cannot resolve to the source tree.
        working-directory: ${{ github.workspace }}/.ci
        env:
          HOME: ${{ github.workspace }}/.ci/isolated_home
          THETAMILL_DATA: ${{ github.workspace }}/.ci/data
          THETAMILL_CONFIG: ${{ github.workspace }}/.ci/no-broker-config.json
        run: |
          mkdir -p "$HOME" "$THETAMILL_DATA"
          python -I -c 'import thetamill; from pathlib import Path; p=Path(thetamill.__file__).resolve(); print(p); assert "site-packages" in str(p), p'
          python -I "$GITHUB_WORKSPACE/scripts/offline_tests.py" --require-installed --tests-dir "$GITHUB_WORKSPACE/tests"
          thetamill --help
          python -I -m thetamill --help
          for cmd in status account positions orders quote chain order strat combo plan run report reconcile roll-plan audit cancel resolve doctor; do
            thetamill "$cmd" --help
          done
