name: Offline safety gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    # NOTE: job-level env may only use github/inputs/matrix/needs/secrets/strategy/vars.
    # `runner` is step-scoped only, so CI scratch paths are derived from github.workspace.
    env:
      THETAMILL_DATA: ${{ github.workspace }}/.ci/data
      THETAMILL_CONFIG: ${{ github.workspace }}/.ci/no-broker-config.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: |
          mkdir -p .ci
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
      - name: Source regression tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Static check baseline (E9 syntax, F pyflakes)
        run: |
          python -m pip install "ruff==0.17.4"
          ruff check --select E9,F thetamill tests scripts
      - name: Coverage floors for the money-path modules
        # A global percentage alone cannot tell "the risk engine is tested" from
        # "the help text is tested", so scripts/coverage_gate.py also holds a
        # per-module floor for execution/ledger/risk/audit/resolve/etc.
        # Every floor is a regression guard at the measured value.
        run: |
          mkdir -p .ci
          python -m pip install "coverage[toml]==7.16.2"
          coverage run -m unittest discover -s tests
          coverage json -o .ci/coverage.json
          python scripts/coverage_gate.py .ci/coverage.json
      - name: Whitespace and conflict markers
        run: |
          # A fresh checkout has no working-tree diff, so compare the pushed
          # commit against its first parent (skipped only for root commits).
          if git rev-parse -q --verify HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          fi
          if grep -rnE '^(<<<<<<< |=======|>>>>>>> )' thetamill tests; then
            exit 1
          fi
      - name: Installed-wheel tests and CLI help without configuration
        # Run outside the checkout so `import thetamill` cannot resolve to the source tree.
        working-directory: ${{ github.workspace }}/.ci
        run: |
          python -I -c 'import thetamill; from pathlib import Path; p=Path(thetamill.__file__).resolve(); print(p); assert "site-packages" in str(p), p'
          python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          thetamill --help
          python -I -m thetamill --help
          for cmd in status account positions orders quote chain order strat combo plan run report reconcile roll-plan audit cancel resolve; do
            thetamill "$cmd" --help
          done
